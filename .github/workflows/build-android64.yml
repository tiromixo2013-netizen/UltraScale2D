name: Build Android64 Geode mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Keep only the newest Android64 build for this branch.
concurrency:
  group: ultrascale2d-android64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build UltraScale2D (Android64)
    runs-on: ubuntu-latest
    steps:
      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Android64
          android-min-sdk: 23
          build-config: Release

      - name: Verify packaged mod exists
        shell: bash
        run: |
          if ! find output -maxdepth 1 -type f -name '*.geode' -print -quit | grep -q .; then
            echo "::error::The build completed without producing a .geode package in output/"
            find build -maxdepth 5 -type f | head -100 || true
            exit 1
          fi
          ls -lh output/*.geode

      - name: Upload Android64 package
        uses: actions/upload-artifact@v4
        with:
          name: UltraScale2D-Android64
          path: output/*.geode
          if-no-files-found: error
