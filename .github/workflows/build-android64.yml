name: Build Android64 Geode mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Android64
          android-min-sdk: 23
          build-config: Release
      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraScale2D-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
